footprint: [[-0.283, -0.190], [-0.283, 0.190], [0.283, 0.190], [0.283, -0.190]]
footprint_padding: 0.02

inflation_radius: 0.35
cost_scaling_factor: 5.0

obstacle_range: 2.0
raytrace_range: 2.5

observation_sources: rtab_scan

rtab_scan:
  sensor_frame: oak-d-base-frame
  data_type: PointCloud2
  topic: /rtabmap/cloud_obstacles
  marking: true
  clearing: true
  min_obstacle_height: 0.05
  max_obstacle_height: 1.5
  obstacle_range: 2.0
  raytrace_range: 2.5
